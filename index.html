<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17324d">
<title>個人用勤務管理</title>
<style>
:root{--navy:#17324d;--blue:#2463a6;--pale:#eef4f9;--line:#d7e0e8;--ink:#17212b;--muted:#637384;--red:#a63232}
*{box-sizing:border-box}
body{margin:0;background:#f3f6f9;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;font-size:14px}
header{background:var(--navy);color:white;padding:7px 9px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0002}
h1{font-size:16px;margin:0}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:7px}
.topline{display:flex;gap:6px;align-items:center;flex-wrap:nowrap}
.topline label{display:none}
.topline label{font-size:12px;color:#e4edf5}
input,select,button,textarea{font:inherit}
input[type=date],select,input[type=text],input[type=time]{min-height:38px;border:1px solid #bdcad6;border-radius:8px;padding:6px 8px;background:white;color:var(--ink);max-width:100%}
#recordDate{font-size:16px;font-weight:700}
main{padding:12px;max-width:900px;margin:auto}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 12px}
button{border:0;border-radius:9px;padding:10px 12px;background:var(--blue);color:white;font-weight:650;cursor:pointer}
button.secondary{background:#e3ebf3;color:#20384e}
button.danger{background:#a63232}
button.small{padding:7px 9px;font-size:12px}
.status{color:var(--muted);font-size:12px;margin-left:auto;align-self:center}
#people{display:grid;grid-template-columns:minmax(0,1fr);gap:7px}
.monthly-overtime{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:0 0 8px}.monthly-overtime summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px}.monthly-overtime summary::-webkit-details-marker{display:none}.monthly-overtime summary:after{content:"＋";font-size:14px;font-weight:800;color:var(--navy)}.monthly-overtime[open] summary:after{content:"−"}.monthly-overtime summary h2{margin:0}.monthly-overtime h2{font-size:12px;margin:0 0 5px;color:var(--navy)}.monthly-overtime-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 8px}.monthly-overtime-item{display:flex;justify-content:space-between;align-items:center;gap:4px;background:#f3f7fa;border-radius:6px;padding:5px 6px;min-width:0}.monthly-overtime-name{font-size:11px;overflow-wrap:anywhere;min-width:0}.monthly-overtime-time{font-size:12px;font-weight:800;color:#245b86;white-space:nowrap}.monthly-overtime-time.over-45{color:#16803c}.monthly-overtime-time.over-100{color:#c62828}.monthly-overtime-note{font-size:9px;color:var(--muted);margin-top:4px}
.name-manager{background:white;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.name-manager>strong{display:block;margin-bottom:8px}
.name-manager-row{display:flex;gap:7px}
.name-manager-row input{flex:1;min-width:0}
.name-roster{display:flex;flex-wrap:wrap;gap:6px}
.name-count{display:inline-block;background:var(--pale);color:var(--navy);border:0;border-radius:7px;padding:7px 10px;font-size:12px;font-weight:700;cursor:pointer}\n.name-list{display:flex;flex-direction:column;align-items:stretch;gap:6px;margin-top:7px}\n.name-list[hidden]{display:none}\n.name-list-item{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;box-sizing:border-box;background:#f4f7fa;border:1px solid var(--line);border-radius:7px;padding:7px 8px;font-size:12px;color:var(--ink)}
.name-list-label{flex:1;min-width:0;padding:2px 3px;cursor:pointer;text-decoration:underline;text-underline-offset:2px;overflow-wrap:anywhere}.holiday-editor{flex-basis:100%;background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px;margin-top:5px}.holiday-editor h3{font-size:13px;margin:0 0 8px}.holiday-editor-row{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;margin:6px 0}.holiday-editor-row input{min-width:0;width:100%}.holiday-date-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid #e6edf2}.holiday-date-item button{padding:4px 7px;font-size:10px}
.name-delete{background:#a63232;color:white;border:0;border-radius:5px;padding:4px 6px;font-size:10px;cursor:pointer}
.attendance-group{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:5px}
.type-row{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:5px;align-items:start}
.type-row .field{min-width:0}
.type-count-badge{display:flex;align-items:center;justify-content:center;min-height:38px;padding:4px 8px;border-radius:8px;background:#edf7ed;color:#237a3b;font-weight:800;text-align:center;white-space:nowrap}
.type-count-badge.over-limit{background:#fff0f0;color:#d00000}
.type-count-field>label{visibility:hidden}
@media(max-width:430px){.type-count-badge{min-height:25px;padding:2px 4px;font-size:10px;border-radius:4px}}

.type-row input[type=date]{width:100%;min-width:0}

.attendance-group .field{min-width:0}\n.conditional-detail{grid-column:1/-1;background:#f5f8fb;border-left:3px solid #8baed1;border-radius:5px;padding:5px 6px;margin-top:-2px}\n.conditional-detail[hidden]{display:none}\n
.name-chip{background:var(--pale);border-radius:7px;padding:5px 8px;font-size:12px;color:var(--navy)}
.person{background:white;border:1px solid var(--line);border-radius:13px;padding:12px;box-shadow:0 2px 5px #10203008}
.person-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.person-head h2{font-size:17px;margin:0;flex:1}
.person-head input{width:100%;max-width:230px;font-weight:700}
.person-no{background:var(--pale);color:var(--navy);border-radius:7px;padding:5px 8px;font-weight:800}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{min-width:0}\n.conditional-detail{grid-column:1/-1;background:#f5f8fb;border-left:3px solid #8baed1;border-radius:5px;padding:5px 6px;margin-top:-2px}\n.conditional-detail[hidden]{display:none}\n
.field.full{grid-column:1/-1}
.field>label,.field-title{display:block;font-size:12px;color:#45586a;font-weight:750;margin:0 0 4px}
.field select,.field input[type=text]{width:100%}
.timepair{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:5px}
.break-panel[hidden]{display:none}
.checkrow{display:flex;align-items:center;gap:9px;min-height:38px;flex-wrap:wrap}
.checkrow label{display:flex;align-items:center;gap:5px}
input[type=checkbox]{width:19px;height:19px;accent-color:var(--blue)}
.inline-detail{display:grid;grid-template-columns:1fr;gap:7px;margin-top:6px}
.inline-detail[hidden]{display:none}
.person-foot{display:flex;justify-content:flex-end;margin-top:10px}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;margin:15px 0}
.pager button{min-width:78px}
#pageLabel{font-weight:800}
.empty{background:white;border:1px dashed #b7c5d2;padding:24px;border-radius:12px;text-align:center;color:var(--muted)}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin:12px 2px}
.saved-list{margin-top:22px;background:white;border:1px solid var(--line);border-radius:12px;padding:12px}
.saved-list h2{font-size:16px;margin:0 0 8px}
.saved-entry{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid #e6edf2}
.saved-entry .date-label{font-weight:750;flex:1}
.saved-entry small{color:var(--muted)}
@media(min-width:720px){#people{grid-template-columns:minmax(0,1fr)}.person{min-width:0}}
@media(max-width:430px){
 body{font-size:10px} header{padding:4px 7px} h1{font-size:13px;margin-bottom:0}
 .header-row{gap:4px} .topline{gap:4px} #recordDate{width:124px;min-width:0;font-size:11px;min-height:27px;padding:2px}
 #loadDate{padding:5px 5px;font-size:9px;white-space:nowrap}
 main{padding:3px} .toolbar{gap:3px;margin-bottom:3px} button{padding:5px 6px;font-size:10px}
 .status{display:none}
 #people{grid-template-columns:minmax(0,1fr);gap:5px}
 .person{padding:3px;border-radius:7px} .person-head{gap:3px;margin-bottom:2px;flex-wrap:nowrap}
 .person-head h2{font-size:11px} .person-head input{max-width:none;min-width:0;flex:1;font-size:10px;min-height:25px;padding:2px}
 .person-no{padding:3px;font-size:9px} .person-head button{padding:4px;font-size:9px}
 .fields{grid-template-columns:repeat(2,minmax(0,1fr));gap:1px}
 .paired-row{grid-column:1/-1;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:3px}
 .field.full{grid-column:auto}
 .overtime-value{display:block!important;visibility:visible!important;min-height:14px!important;font-size:10px!important;line-height:14px!important;text-align:right!important;grid-column:1/-1!important}
 .field>label,.field-title{font-size:9px;margin-bottom:0;line-height:1}
 input[type=date],select,input[type=text],input[type=time]{min-height:25px;padding:2px;font-size:10px;border-radius:4px}
 .timepair{gap:2px;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
 .timepair select{min-width:0;width:100%;padding:3px 1px;font-size:11px;letter-spacing:-.3px}
 .field:has(.timepair){grid-column:1/-1}\n 
 .field:has(.timepair) select{font-size:12px;min-height:29px;padding:3px 2px}
 .checkrow{gap:2px;min-height:18px;flex-wrap:nowrap} .checkrow label{gap:2px;font-size:9px;white-space:nowrap}
 input[type=checkbox]{width:12px;height:12px;margin:0}
 .inline-detail{gap:3px}
 .pager{margin:5px 0;gap:6px} .pager button{min-width:52px}
 .note{font-size:9px;margin:4px 1px} .saved-list{margin-top:7px;padding:6px} .saved-list h2{font-size:12px}
 main>p.note{display:none}
 .name-manager{padding:5px;margin-bottom:4px} .name-manager-row input{min-width:0}
 .name-manager .note{display:none}
}
</style>

.field:has(.remarks-area){grid-column:1/-1!important;width:100%!important;min-width:0!important;box-sizing:border-box!important;margin-top:0!important;margin-bottom:0!important;gap:1px!important}.field:has(.remarks-area)>label{margin-bottom:0!important;line-height:1.1!important}

<style>
/* 名前クリック時の詳細ページ */
.holiday-editor.detail-page{
 position:fixed!important;inset:0!important;z-index:1000!important;

<style>
.person-calendar{margin:12px 0 16px;background:#fff;border:1px solid #d7e0e8;border-radius:12px;padding:10px;box-shadow:0 2px 5px #10203008}
.person-calendar h3{margin:0 0 8px;font-size:15px;color:#17324d}
.calendar-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.calendar-toolbar strong{font-size:15px}
.calendar-toolbar button{padding:6px 10px}
.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.calendar-weekday{text-align:center;font-size:11px;font-weight:800;color:#526679;padding:4px 0}.calendar-weekday:first-child{color:#d32f2f}.calendar-weekday:nth-child(7){color:#1976d2}
.calendar-day{min-height:57px;border:1px solid #e0e7ed;border-radius:6px;padding:3px 2px;background:#fbfcfd;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.calendar-day.blank{background:transparent;border-color:transparent}

.calendar-day .day-num{font-size:10px;color:#526679;align-self:flex-start;line-height:1.1}

.calendar-mark.comp-click{border:0;background:#e8f0f8;color:#17324d;border-radius:5px;padding:2px 3px;font-size:11px;cursor:pointer}

@media(max-width:430px){.person-calendar{padding:6px;margin:7px 0}.calendar-day{min-height:48px;padding:2px 1px}.calendar-mark{font-size:10px}.calendar-mark.comp-click{font-size:9px;padding:2px}.calendar-toolbar strong{font-size:12px}.calendar-toolbar button{padding:5px 7px;font-size:10px}}

<body>
<header>
  <div class="header-row">
    <h1>個人用勤務管理</h1>
    <div class="topline">
    <input type="date" id="recordDate" aria-label="勤務日">
    <button class="small secondary" id="loadDate">この日で作成</button>
    </div>
  </div>
</header>
<main>
  <div class="toolbar">
    
    <button class="danger" id="newDay">新規作成</button>
    <button class="secondary" id="saveDay">この日の内容を保存</button>
    <button class="secondary" id="exportData">バックアップ保存</button>
    <button class="secondary" id="importBtn">データ読込</button>
    
    <input type="file" id="importFile" accept=".json,application/json" hidden>
    <span class="status" id="status">端末内に自動保存</span>
  </div>
  <details class="monthly-overtime" aria-label="月間超過勤務集計"><summary><h2 id="monthlyOvertimeTitle">月間超過勤務時間</h2></summary><div id="monthlyOvertime" class="monthly-overtime-grid"></div><div class="monthly-overtime-note">保存済みの勤務記録を集計。入力中の日は現在の内容を反映します。</div></details>
  <details class="monthly-overtime" aria-label="月間祝日勤務集計"><summary><h2 id="monthlyHolidayTitle">月間祝日勤務時間</h2></summary><div id="monthlyHolidayWork" class="monthly-overtime-grid"></div><div class="monthly-overtime-note">祝休・祝代休日に勤務した時間から休憩を除いて集計します。</div></details>
  <div id="people"></div>
  <div class="pager">
    <button class="secondary" id="prevPage">‹ 前へ</button>
    <span id="pageLabel">1 / 1 ページ</span>
    <button class="secondary" id="nextPage">次へ ›</button>
  </div>
  <p class="note">このシステムは1人専用です。勤務記録はこの端末のブラウザ内に保存されます。管理者へ提出するときは「バックアップ保存」で作成したJSONファイルを送ってください。</p>
  <section class="saved-list">
    <h2>保存済みの日付</h2>
    <div id="savedDates"></div>
  </section>
  <section class="name-manager">
    <strong>自分の名前</strong>
    <div class="name-manager-row">
      <input type="text" id="newName" placeholder="自分の名前を入力" maxlength="40">
      <button id="registerName">名前を設定</button>
    </div>
    <div class="note">この端末で使う名前を1人分だけ設定できます。変更しても過去の勤務記録は削除されません。</div>
    <div id="nameRoster" class="name-roster"></div>
  </section>


<section id="personalHolidayDashboard" class="monthly-overtime" style="margin-top:10px">
<h2>代休・祝代休の管理</h2>
<div id="personalHolidayBalances" style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0"></div>
<div id="personalHolidayCalendar"></div>
<div id="personalHolidayDates"></div>
</section>

  <div class="reset-area" style="margin:24px 0 18px;padding:14px 0;border-top:1px solid #d5dfe7;text-align:center">
    <button class="danger" id="resetAllData" style="width:100%;max-width:420px">全データリセット</button>
    <div class="note" style="margin-top:6px">勤務記録など、この端末に保存されたデータをすべて削除します。</div>
  </div>
</main>
<script>
(function(){
const TYPES=['日勤','週休','代休','祝休','祝代休','夏特','夏休','冬休','年休'];
const $=id=>document.getElementById(id);
// 保存領域をアプリ別に分離。新しい保存先が空の場合のみ、旧データを引き継ぐ。
const STORAGE_PREFIX='workResultPersonal';
const STORAGE_KEYS={records:STORAGE_PREFIX+'Records_v1',names:STORAGE_PREFIX+'Names_v1',dispatch:STORAGE_PREFIX+'DispatchPlaces_v1',holiday:STORAGE_PREFIX+'HolidayDates_v1',autoHoliday:STORAGE_PREFIX+'AutoHolidayDates_v1'};
(function migrateLegacyStorage(){
 const pairs=[['workResultRecords_v1',STORAGE_KEYS.records],['workResultNames_v1',STORAGE_KEYS.names],['workResultDispatchPlaces_v1',STORAGE_KEYS.dispatch],['workResultHolidayDates_v1',STORAGE_KEYS.holiday],['workResultAutoHolidayDates_v1',STORAGE_KEYS.autoHoliday]];
 try{pairs.forEach(([oldKey,newKey])=>{if(localStorage.getItem(newKey)===null&&localStorage.getItem(oldKey)!==null)localStorage.setItem(newKey,localStorage.getItem(oldKey));});}catch(e){}
})();
const STORAGE=STORAGE_KEYS.records;
let records=readStore(), currentDate=localDate(), people=[], page=0, dirty=false;
const NAME_STORAGE=STORAGE_KEYS.names;
// 名前照合用：前後の空白を除き、半角・全角スペースの違いを統一する。
function normalizePersonName(value){
 return String(value||'').normalize('NFKC').replace(/[\\s\\u3000]+/g,'').trim();
}

const DISPATCH_PLACE_STORAGE=STORAGE_KEYS.dispatch;
let savedDispatchPlaces=readDispatchPlaces();
function readDispatchPlaces(){try{const x=JSON.parse(localStorage.getItem(DISPATCH_PLACE_STORAGE)||'[]');return Array.isArray(x)?x.filter(v=>typeof v==='string'&&v.trim()):[]}catch(e){return []}}
function writeDispatchPlaces(){try{localStorage.setItem(DISPATCH_PLACE_STORAGE,JSON.stringify(savedDispatchPlaces));return true}catch(e){return false}}
function rememberDispatchPlace(value){const v=String(value||'').trim();if(!v)return;if(!savedDispatchPlaces.includes(v)){savedDispatchPlaces.push(v);savedDispatchPlaces.sort((a,b)=>a.localeCompare(b,'ja'));writeDispatchPlaces()}}
const HOLIDAY_STORAGE=STORAGE_KEYS.holiday;
const AUTO_HOLIDAY_STORAGE=STORAGE_KEYS.autoHoliday;
let autoHolidayDates=readAutoHolidayDates();
function readAutoHolidayDates(){try{const x=JSON.parse(localStorage.getItem(AUTO_HOLIDAY_STORAGE)||'{}');return x&&typeof x==='object'?x:{}}catch(e){return {}}}
function writeAutoHolidayDates(){try{localStorage.setItem(AUTO_HOLIDAY_STORAGE,JSON.stringify(autoHolidayDates));return true}catch(e){return false}}
function markAutoHolidayDate(name,key,dateStr){autoHolidayDates[name]=autoHolidayDates[name]||{compensatory:[],holiday:[]};autoHolidayDates[name][key]=Array.isArray(autoHolidayDates[name][key])?autoHolidayDates[name][key]:[];if(!autoHolidayDates[name][key].includes(dateStr)){autoHolidayDates[name][key].push(dateStr);writeAutoHolidayDates()}}
function cancelAutoHolidayDate(name,key,dateStr){
 const tracked=autoHolidayDates[name]?.[key];
 if(!Array.isArray(tracked)||!tracked.includes(dateStr))return;
 autoHolidayDates[name][key]=tracked.filter(d=>d!==dateStr);
 writeAutoHolidayDates();
 const stillUsedByOtherWork=Object.entries(records).some(([date,rec])=>date!==currentDate&&rec&&Array.isArray(rec.people)&&rec.people.some(p=>p&&p.name===name&&p.type==='日勤'&&date===dateStr));
 if(!stillUsedByOtherWork){
  const arr=datesFor(name,key);
  holidayDates[name]=holidayDates[name]||{compensatory:[],holiday:[]};
  holidayDates[name][key]=arr.filter(d=>d!==dateStr);
  writeHolidayDates();
 }
}
let savedNames=readNames().slice(0,1);
let holidayDates=readHolidayDates();
let editingHolidayName='';
function readNames(){try{return JSON.parse(localStorage.getItem(NAME_STORAGE)||'[]').filter(n=>typeof n==='string')}catch(e){return []}}
function readHolidayDates(){try{const x=JSON.parse(localStorage.getItem(HOLIDAY_STORAGE)||'{}');return x&&typeof x==='object'?x:{}}catch(e){return {}}}
function writeHolidayDates(){try{localStorage.setItem(HOLIDAY_STORAGE,JSON.stringify(holidayDates));return true}catch(e){alert('代休の日付を保存できませんでした。端末の空き容量を確認してください。');return false}}

// Japanese national holidays are calculated offline, so this works without internet.
function jpHolidayName(dateStr){
 const [y,m,d]=dateStr.split('-').map(Number);
 const dt=new Date(y,m-1,d), dow=dt.getDay();
 // 年末年始の特別な祝日扱い：12/29〜12/31、1/1〜1/3
 if((m===12&&d>=29)||(m===1&&d<=3))return '年末年始';
 const nth=(month,n,weekday)=>{let first=new Date(y,month-1,1).getDay();return 1+((weekday-first+7)%7)+(n-1)*7};
 const eqSpring=Math.floor(20.8431+0.242194*(y-1980)-Math.floor((y-1980)/4));
 const eqAutumn=Math.floor(23.2488+0.242194*(y-1980)-Math.floor((y-1980)/4));
 const fixed={
  '1-1':'元日','2-11':'建国記念の日','2-23':'天皇誕生日','4-29':'昭和の日',
  '5-3':'憲法記念日','5-4':'みどりの日','5-5':'こどもの日','8-11':'山の日',
  '11-3':'文化の日','11-23':'勤労感謝の日'
 };
 if(m===1&&d===nth(1,2,1))return '成人の日';
 if(m===7&&d===nth(7,3,1))return '海の日';
 if(m===9&&d===nth(9,3,1))return '敬老の日';
 if(m===10&&d===nth(10,2,1))return 'スポーツの日';
 if(m===3&&d===eqSpring)return '春分の日';
 if(m===9&&d===eqAutumn)return '秋分の日';
 if(fixed[`${m}-${d}`])return fixed[`${m}-${d}`];
 // Olympic-related one-off moves in 2020 and 2021
 const oneOff={
  '2020-7-23':'海の日','2020-7-24':'スポーツの日','2020-8-10':'山の日',
  '2021-7-22':'海の日','2021-7-23':'スポーツの日','2021-8-8':'山の日'
 };
 if(oneOff[dateStr])return oneOff[dateStr];
 // Citizens' holidays: weekday between two national holidays (2026 onward rules included)
 const prev=new Date(y,m-1,d-1), next=new Date(y,m-1,d+1);
 const key=x=>`${x.getMonth()+1}-${x.getDate()}`;
 const isBaseHoliday=x=>{
  const yy=x.getFullYear(), mm=x.getMonth()+1, dd=x.getDate(), ds=`${yy}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
  if(yy===y&&ds===dateStr)return false;
  const fixedMap={'1-1':1,'2-11':1,'2-23':1,'4-29':1,'5-3':1,'5-4':1,'5-5':1,'8-11':1,'11-3':1,'11-23':1};
  const nn=(mo,n,w)=>{const f=new Date(yy,mo-1,1).getDay();return 1+((w-f+7)%7)+(n-1)*7};
  const es=Math.floor(20.8431+0.242194*(yy-1980)-Math.floor((yy-1980)/4));
  const ea=Math.floor(23.2488+0.242194*(yy-1980)-Math.floor((yy-1980)/4));
  return !!fixedMap[`${mm}-${dd}`]||(mm===1&&dd===nn(1,2,1))||(mm===7&&dd===nn(7,3,1))||(mm===9&&dd===nn(9,3,1))||(mm===10&&dd===nn(10,2,1))||(mm===3&&dd===es)||(mm===9&&dd===ea)||!!oneOff[ds];
 };
 if(dow!==0&&isBaseHoliday(prev)&&isBaseHoliday(next))return '国民の休日';
 // Substitute holiday: Sunday national holiday shifts to next non-holiday.
 for(let back=1;back<=7;back++){
  const prior=new Date(y,m-1,d-back);
  if(prior.getDay()===0&&isBaseHoliday(prior)){
   let sub=new Date(prior);
   do{sub.setDate(sub.getDate()+1)}while(isBaseHoliday(sub)||sub.getDay()===0);
   if(sub.getFullYear()===y&&sub.getMonth()===m-1&&sub.getDate()===d)return '振替休日';
  }
 }
 return '';
}
function usedDatesFor(name,key){
 const wantedType=key==='holiday'?'祝代休':'代休';
 const used=[];
 Object.values(records).forEach(rec=>{
  if(!rec||!Array.isArray(rec.people))return;
  rec.people.forEach(person=>{
   if(person&&person.name===name&&person.type===wantedType&&person.compensatoryDate&&!used.includes(person.compensatoryDate))used.push(person.compensatoryDate);
  });
 });
 return used;
}
function availableDatesFor(name,key){const used=usedDatesFor(name,key);return datesFor(name,key).filter(d=>!used.includes(d))}
function addRegisteredHolidayDate(name,key,dateStr){
 if(!name||!dateStr)return false;
 holidayDates[name]=holidayDates[name]||{compensatory:[],holiday:[]};
 holidayDates[name][key]=Array.isArray(holidayDates[name][key])?holidayDates[name][key]:[];
 if(holidayDates[name][key].includes(dateStr))return false;
 holidayDates[name][key].push(dateStr);holidayDates[name][key].sort();
 writeHolidayDates();return true;
}
function autoRegisterWorkDate(person){

 const [y,m,d]=currentDate.split('-').map(Number);
 const dow=new Date(y,m-1,d).getDay();
 const holidayName=jpHolidayName(currentDate);
 // 祝日扱いの日は祝代休発生日を優先。土日と重なっても週休の代休発生日には登録しない。
 if(holidayName){
  if(!datesFor(person.name,'holiday').includes(currentDate)){
   addRegisteredHolidayDate(person.name,'holiday',currentDate);
   markAutoHolidayDate(person.name,'holiday',currentDate);
  }
  return;
 }
 if(dow===0||dow===6){
  if(!datesFor(person.name,'compensatory').includes(currentDate)){
   addRegisteredHolidayDate(person.name,'compensatory',currentDate);
   markAutoHolidayDate(person.name,'compensatory',currentDate);
  }
 }
}

function makeTimes(step=15){let a=[];for(let m=0;m<1440;m+=step)a.push(`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`);return [...new Set(a)]}
const times=makeTimes(15);
const overnightTimes=[...times.map(t=>({value:t,label:t})),...times.map(t=>({value:'翌'+t,label:'翌'+t}))];
function timeLabel(value){return String(value||'').startsWith('翌')?'翌'+String(value).slice(2):value;}
function timeMinutes(value){if(!value)return null;const v=String(value);const next=v.startsWith('翌');const t=next?v.slice(1):v;const m=t.match(/^(\d{2}):(\d{2})$/);if(!m)return null;return Number(m[1])*60+Number(m[2])+(next?1440:0)}
function overtimeMinutes(person){
 const start=timeMinutes(person.workStart),end=timeMinutes(person.workEnd);
 if(start===null||end===null)return null;
 let finish=end;if(finish<start)finish+=1440;
 if(finish<=start)return 0;
 let breaks=Array.isArray(person.breaks)?person.breaks:[];
 // 日勤で休憩をまだ登録していない場合は標準の昼休みを使う
 if(!breaks.length&&person.type==='日勤')breaks=[{start:'12:00',end:'13:00'}];
 let breakTotal=0;
 for(const br of breaks){
  const bs=timeMinutes(br.start),be=timeMinutes(br.end);
  if(bs===null||be===null)continue;
  let bEnd=be;if(bEnd<bs)bEnd+=1440;
  breakTotal+=Math.max(0,Math.min(finish,bEnd)-Math.max(start,bs));
 }
 // 祝代休日の勤務時間は超過勤務ではなく、別枠の祝日勤務時間として集計する。
 if(person.type==='祝代休')return 0;
 // 週休・代休に勤務時間を任意入力した場合は、休憩を除いた実勤務時間を全て超過勤務として計上。
 if(['週休','代休'].includes(person.type))return Math.max(0,(finish-start)-breakTotal);
 // 基準勤務は08:30〜17:15（休憩を除いた実勤務7時間45分）。休憩は回数分すべて差し引く。
 return Math.max(0,(finish-start)-breakTotal-465);
}

function fiscalYearOf(dateStr){

const SPECIAL_LIMITS={'夏特':5,'夏休':7,'冬休':3};
function specialLeaveCount(name,type,index){
 if(!name||!SPECIAL_LIMITS[type])return 0;
 const fy=fiscalYearOf(currentDate), entries=[];
 Object.keys(records).forEach(date=>{
  if(date===currentDate||fiscalYearOf(date)!==fy)return;
  const rec=records[date];
  if(!rec||!Array.isArray(rec.people))return;
  rec.people.forEach((person,position)=>{
   if(person&&person.name===name&&person.type===type)entries.push({date,position,person});
  });
 });
 people.forEach((person,position)=>{
  if(person&&person.name===name&&person.type===type)entries.push({date:currentDate,position,person,current:true});
 });
 // 年度内の日付が早い順。同じ日なら画面上の並び順で番号を付ける。
 entries.sort((a,b)=>a.date.localeCompare(b.date)||a.position-b.position);
 const target=people[index];
 const found=entries.findIndex(entry=>entry.current&&entry.person===target);
 return found<0?0:found+1;
}

function holidayWorkMinutes(person){

  });
  if(!preview.length)throw Error('勤務記録がありません');
  const duplicates=[];
  preview.forEach(item=>{
   const existing=records[item.date]?.people||[];
   if(existing.some(p=>p&&p.name===item.name))duplicates.push(item);

  if(duplicates.length)message+=`\n\n同じ職員・同じ日付の記録が${duplicates.length}件あります。該当する職員の記録だけを置き換えます。他の職員の記録は残ります。`;

  });

  alert(`取り込み完了。${preview.length}件の勤務記録を統合しました。`);
 }catch(err){alert('取り込めませんでした。バックアップ形式と勤務記録を確認してください。')}finally{e.target.value=''}

   if(fiscalYearOf(ds)!==fy)return;
   const rec=records[ds];if(!Array.isArray(rec?.people))return;
   rec.people.forEach((p,pos)=>{if(p&&p.name===name&&p.type===type)entries.push({date:ds,pos,p})});
 });
 if(dirty&&currentDate===date){
   const existing=entries.filter(e=>e.date!==date);
   people.forEach((p,pos)=>{if(p&&p.name===name&&p.type===type)existing.push({date,pos,p})});
   entries.splice(0,entries.length,...existing);
 }
 entries.sort((a,b)=>a.date.localeCompare(b.date)||a.pos-b.pos);
 const idx=entries.findIndex(e=>e.date===date&&e.p===person);
 if(idx>=0)return idx+1;
 const sameDay=entries.filter(e=>e.date===date);
 return Math.max(1,sameDay.length);
}

function renderPersonalHolidayDashboard(){
 const root=$('personalHolidayDashboard');if(!root)return;
 const name=(savedNames[0]||people[0]?.name||'').trim();
 const balances=$('personalHolidayBalances');balances.replaceChildren();
 const datesRoot=$('personalHolidayDates');datesRoot.replaceChildren();
 if(!name){balances.textContent='先に名前を登録してください。';$('personalHolidayCalendar').replaceChildren();return;}
 const comp=availableDatesFor(name,'compensatory'),hol=availableDatesFor(name,'holiday');
 [[`代休残 ${comp.length}日`,'#e8f1fa'],[`祝代休残 ${hol.length}日`,'#fff0e8']].forEach(([t,c])=>{const b=document.createElement('strong');b.textContent=t;b.style.cssText=`display:inline-block;padding:8px 12px;border-radius:9px;background:${c};`;balances.append(b)});
 const calendar=$('personalHolidayCalendar');calendar.replaceChildren();renderPersonCalendar(name,calendar);
 [['compensatory','代休発生日'],['holiday','祝代休発生日']].forEach(([key,title])=>{
  const box=document.createElement('div');box.style.cssText='border-top:1px solid #d8e0e6;padding-top:10px;margin-top:10px';
  const h=document.createElement('h3');h.textContent=title;box.append(h);
  const row=document.createElement('div');row.style.cssText='display:flex;gap:8px;align-items:center';
  const input=document.createElement('input');input.type='date';input.style.cssText='flex:1;min-width:0';
  const add=document.createElement('button');add.type='button';add.className='primary';add.textContent='日付を登録';
  add.addEventListener('click',()=>{if(!input.value){alert('日付を選択してください。');return;}if(!addRegisteredHolidayDate(name,key,input.value)){alert('その日付は登録済みです。');return;}renderPersonalHolidayDashboard();});
  row.append(input,add);box.append(row);
  const list=document.createElement('div');
  datesFor(name,key).slice().sort().forEach(ds=>{const item=document.createElement('div');item.className='holiday-date-item';const label=document.createElement('span');label.textContent=ds+(usedDatesFor(name,key).includes(ds)?'（使用済み）':'');const del=document.createElement('button');del.type='button';del.className='danger';del.textContent='削除';del.addEventListener('click',()=>{if(!confirm(`${ds}を削除しますか？`))return;holidayDates[name][key]=datesFor(name,key).filter(d=>d!==ds);writeHolidayDates();renderPersonalHolidayDashboard();});item.append(label,del);list.append(item)});
  box.append(list);datesRoot.append(box);
 });
}

$('registerName').addEventListener('click',()=>{
 const input=$('newName');const name=input.value.trim();
 if(!name){alert('名前を入力してください。');input.focus();return;}
 if(savedNames.length===1&&normalizePersonName(savedNames[0])===normalizePersonName(name)){alert('この名前は設定済みです。');return;}
 if(savedNames.length&&savedNames[0]!==name&&!confirm(`名前を「${name}」に変更しますか？\\n過去の勤務記録に入っている名前は自動変更されません。`))return;
 savedNames=[name];
 if(!writeNames())return;
 input.value='';
 if(people.length===0){people=[blankPerson(1)];people[0].name=name;dirty=true;}
 else {people=people.slice(0,1);people[0].name=name;dirty=true;}
 page=0;render();$('status').textContent='名前を設定しました。勤務記録を保存してください。';renderPersonalHolidayDashboard();
});

// 起動時は「新規作成」ボタンを押した直後と同じ、空の入力画面から始める。保存済みデータは変更しない。
currentDate=localDate();
people=savedNames.length?[{...blankPerson(1),name:savedNames[0]}]:[];
page=0;dirty=false;$('recordDate').value=currentDate;render();

renderNameRoster();
renderPersonalHolidayDashboard();
